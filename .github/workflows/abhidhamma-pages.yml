# Publishes the abhidhamma/ folder as a GitHub Pages site whenever it changes on master.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site then lives at https://<owner>.github.io/<repo>/ (the atlas under atlas/).
name: Publish the Abhidhamma Atlas

on:
  push:
    branches: [master]
    paths: ["abhidhamma/**", ".github/workflows/abhidhamma-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: abhidhamma
      - id: deploy
        uses: actions/deploy-pages@v4
