# Builds the Abhidhamma reading website (abhidhamma/site) and publishes it with GitHub Pages
# whenever abhidhamma/ changes on master. The atlas, its PDF and the model are copied in under it.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site then lives at https://<owner>.github.io/<repo>/ (the atlas under atlas/).
name: Publish the Abhidhamma website

on:
  push:
    branches: [master]
    paths: ["abhidhamma/**", ".github/workflows/abhidhamma-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: abhidhamma/site/package-lock.json
      - name: Build the site
        working-directory: abhidhamma/site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}/
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm i -g playwright@1.56.1 && npx -y playwright@1.56.1 install --with-deps chromium
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: abhidhamma/site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
